name: Keep Render app warm

# Render's free tier spins the service down after a period of inactivity,
# so the first real visitor eats a cold start. Ping the deployed URL often
# enough that it never goes idle.
#
# GitHub only guarantees scheduled workflows run "as close to" the cron time
# as load allows — a few minutes of drift is normal, especially on the
# public runner queue. workflow_dispatch is here so the ping can be run
# on demand (e.g. right after a deploy) without waiting on the schedule.
on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed URL
        run: |
          curl --fail --silent --show-error --max-time 15 \
            -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
            https://order-and-settlement-app.onrender.com/
